<!doctype html><html><head><meta charset="utf-8"><title>Dot Matrix Black Hole</title>
<style>html,body{margin:0;height:100%;background:#090909;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas><script>
"use strict";
const o={schemecolor:[.953,.325,.102],hotcolor:[1,.56,.34],bgcolor:[.035,.035,.035],pattern:"blackhole",automode:true,holesize:81,bend:100,doppler:0,ring:100,stars:50,density:224,dotsize:50,shape:"round",unlit:35,brightness:100,speed:100,reverse:false,particles:8000,trail:58,centerx:50,centery:52,hole:45,spread:100,flat:65,tilt:12,fade:1,audio:true,audioamt:100,mouse:false};
const cv=document.getElementById("c"),gl=cv.getContext("webgl",{alpha:false,antialias:false,powerPreference:"low-power"});
const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x};
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision highp float;
uniform sampler2D t;uniform vec2 g,res;uniform float pitch,size,unlit,sq;uniform vec3 col,hot,bg;
void main(){vec2 px=vec2(gl_FragCoord.x,res.y-gl_FragCoord.y);vec2 c=floor(px/pitch);
float v=texture2D(t,(c+.5)/g).r;vec2 q=abs(fract(px/pitch)-.5)*2.;
float d=mix(length(q),max(q.x,q.y),sq);
float r=mix(.18+.12*unlit,size,pow(v,.6));
float a=clamp((r-d)*pitch*.5+.5,0.,1.);
float lt=smoothstep(.25,.75,dot(bg,vec3(.333)));vec3 off=bg+vec3(mix(.11,-.14,lt))*unlit;vec3 low=mix(col*.38,mix(bg,col,.5),lt);
vec3 k=v<.22?mix(off,low,v/.22):v<.68?mix(low,col,(v-.22)/.46):mix(col,hot,(v-.68)/.32);
float vis=max(step(.004,v),step(.001,unlit));
gl_FragColor=vec4(mix(bg,k,a*vis),1.);}`));
gl.linkProgram(pr);gl.useProgram(pr);
const U={};["t","g","res","pitch","size","unlit","sq","col","hot","bg"].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const ap=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,gl.NEAREST],[gl.TEXTURE_MAG_FILTER,gl.NEAREST],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
let W=0,H=0,GW=0,GH=0,pitch=16,E,B,fadeCol,ps=[];
function layout(){const r=window.devicePixelRatio||1,w=Math.max(1,Math.round(innerWidth*r)),h=Math.max(1,Math.round(innerHeight*r));
 if(w!==W||h!==H){W=w;H=h;cv.width=W;cv.height=H}
 pitch=Math.max(3,Math.round(W/o.density));GW=Math.ceil(W/pitch);GH=Math.ceil(H/pitch);E=new Float32Array(GW*GH);B=new Uint8Array(GW*GH);
 fadeCol=new Float32Array(GW);for(let x=0;x<GW;x++)fadeCol[x]=Math.min(1,Math.max(.1,1+.15*Math.min(1,o.fade/50)-x/GW*1.05*o.fade/100))}
const ga=()=>{let a=0;for(let i=0;i<3;i++)a+=-Math.log(1-Math.random());return a};
function spawn(p,first){p.u=first?Math.random():0;p.life=8+Math.random()*16;p.r0=.02+ga()*.045;p.dr=.045+Math.random()*.15;p.th=Math.random()*6.2832;p.w=.75+Math.random()*.35;p.wb=Math.random()*6.2832;p.a=.35+.65*Math.pow(Math.random(),1.6);p.out=2.2+Math.pow(Math.random(),1.4)*6.5;p.h=(Math.random()-.5)*.12;return p}
function pool(){while(ps.length<o.particles)ps.push(spawn({},true));ps.length=Math.round(o.particles)}
let bass=0,level=0,lvS=0,bands=new Float32Array(64),mx=-9,my=-9;
function splat(x,y,b){const ix=Math.floor(x),iy=Math.floor(y);if(ix<0||iy<0||ix>=GW-1||iy>=GH-1)return;
 const fx=x-ix,fy=y-iy,i=iy*GW+ix,b0=b*(1-fy),b1=b*fy;E[i]+=b0*(1-fx);E[i+1]+=b0*fx;E[i+GW]+=b1*(1-fx);E[i+GW+1]+=b1*fx}
let T=0;
function swirl(dt){const s=GW,cx=o.centerx/100*GW,cy=o.centery/100*GH,an=o.tilt*Math.PI/180,c=Math.cos(an),n=Math.sin(an),q=1-o.flat/100,sp=o.spread/100,ho=o.hole/100*.24,dir=o.reverse?-1:1,k=1+bass*1.6;
 for(const p of ps){p.u+=dt/p.life;if(p.u>=1)spawn(p,false);
  const r=(ho+p.r0+p.dr*p.u)*sp,w=p.w*Math.pow(.2/(r+.06),.75)*.42;p.th+=dir*w*dt;
  const x=r*Math.cos(p.th)*s,y=r*Math.sin(p.th)*q*s+1.5*Math.sin(p.wb+6.2832*p.u);
  let X=cx+x*c-y*n,Y=cy+x*n+y*c;
  if(o.mouse&&mx>-1){const dx=X-mx*GW,dy=Y-my*GH,d=Math.hypot(dx,dy)+.01,R=GW*.08;if(d<R){const f=(R-d)/d*.7;X+=dx*f;Y+=dy*f}}
  splat(X,Y,p.a*Math.pow(Math.sin(Math.PI*Math.min(1,p.u)),.7)*k)}}
function blackhole(dt){
 const cx=o.centerx/100*GW,cy=o.centery/100*GH,an=o.tilt*Math.PI/180,c=Math.cos(an),n=Math.sin(an),q=1-o.flat/100,dir=o.reverse?-1:1;
 const Rh=Math.max(2,o.holesize/1000*GW*(1+bass*.10)),b2=1.15*o.bend/100,dp=o.doppler/100,sp=o.spread/100,k=1+bass*1.3;
 for(const p of ps){p.u+=dt/(p.life*1.25);if(p.u>=1)spawn(p,false);
  // fall inwards, faster and brighter near the hole
  const r=(1.22+(p.out*sp)*tFall[p.u*TN|0]);const ri=Math.min(TN,r/RM*TN|0);p.th+=dir*dt*tW[ri]*p.w;
  const X=r*Math.cos(p.th),Z=r*Math.sin(p.th);let x=X,y=Z*q+p.h;
  const R=Math.sqrt(x*x+y*y)+1e-4,back=Math.max(0,Math.min(1,-Z*1.2+.15));
  // light from behind the hole is bent outwards around it (lens equation)
  const L=(R+Math.sqrt(R*R+4*b2*back))/2;x*=L/R;y*=L/R;
  if(Z<0&&L<1.02)continue;
  const dop=dp===0?1:Math.pow(Math.max(.12,1-dp*dir*.85*X/r),1.6);
  let a=p.a*Math.min(1,p.u*6)*tB[ri]*dop*k;
  let sx=x*Rh,sy=y*Rh,Px=cx+sx*c-sy*n,Py=cy+sx*n+sy*c;
  if(o.mouse&&mx>-1){const dx=Px-mx*GW,dy=Py-my*GH,d=Math.hypot(dx,dy)+.01,M=GW*.07;if(d<M){const f=(M-d)/d*.7;Px+=dx*f;Py+=dy*f}}
  splat(Px,Py,a);
  // faint second image tucked under the hole
  if(back>.5&&r<4.5){const L2=(Math.sqrt(R*R+4*b2)-R)/2;if(L2>.98){const m=-L2/R;let tx=X*m*Rh,ty=(Z*q+p.h)*m*Rh;splat(cx+tx*c-ty*n,cy+tx*n+ty*c,a*.28)}}}}
const TN=2048,RM=24,tFall=new Float32Array(TN+1),tW=new Float32Array(TN+1),tB=new Float32Array(TN+1),tSin=new Float32Array(TN+1);
for(let i=0;i<=TN;i++){const f=i/TN,r=Math.max(.5,f*RM);tFall[i]=Math.pow(1-f,1.25);tW[i]=1.9*Math.pow(r,-1.35);tB[i]=Math.pow(3.2/(r+1.2),1.25);tSin[i]=f}
let stars=null;
function holeGlow(){const cx=o.centerx/100*GW,cy=o.centery/100*GH,an=o.tilt*Math.PI/180,c=Math.cos(an),n=Math.sin(an),dir=o.reverse?-1:1,dp=o.doppler/100,Rh=Math.max(2,o.holesize/1000*GW*(1+bass*.10)),rg=o.ring/100;
 if(!stars){stars=[];for(let i=0;i<420;i++)stars.push([Math.random(),Math.random(),Math.random(),Math.random()*6.28])}
 const want=Math.round(stars.length*o.stars/100),b2=1.15*o.bend/100;
 for(let i=0;i<want;i++){const s=stars[i];let dx=s[0]*GW-cx,dy=s[1]*GH-cy;const R=Math.hypot(dx,dy)/Rh+1e-4,L=(R+Math.sqrt(R*R+4*b2))/2;dx*=L/R;dy*=L/R;
  const x=Math.round(cx+dx),y=Math.round(cy+dy);if(x>=0&&y>=0&&x<GW&&y<GH)set(x,y,(.05+.16*s[2]*s[2])*(.75+.25*Math.sin(T*1.3+s[3])))}
 const m=Math.ceil(Rh*1.9),w=Math.max(.085,.62/Rh);
 for(let y=Math.max(0,Math.floor(cy-m));y<Math.min(GH,cy+m);y++)for(let x=Math.max(0,Math.floor(cx-m));x<Math.min(GW,cx+m);x++){
  const dx=x+.5-cx,dy=y+.5-cy,d=Math.hypot(dx,dy)/Rh,ux=(dx*c+dy*n)/Rh/(d+1e-4);
  const f=Math.exp(-Math.pow((d-1.14)/w,2))*.95+Math.exp(-Math.max(0,d-1.14)*4.2)*(d>1.1?.16:0);
  if(f>.02)set(x,y,f*rg*Math.max(.25,1-dp*dir*.65*ux)*(1+bass))}}
const set=(x,y,v)=>{if(v>E[y*GW+x])E[y*GW+x]=v};
function waves(){const d=o.reverse?-1:1,q=1+bass*1.2;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const u=x/GW*6.2832,v=y/GW*6.2832;
 const f=Math.sin(u*2+v*1.3-d*T*.9)+Math.sin(u*1.1-v*2.2+d*T*.7)+Math.sin((u+v)*1.7+d*T*.5);set(x,y,Math.pow(Math.max(0,f/3),1.6)*1.5*q*o.particles/2600)}}
let drops=[];
function rain(dt){const want=Math.round(o.particles/26);while(drops.length<want)drops.push({x:Math.random(),y:Math.random()*1.3-.3,v:.1+Math.random()*.35,a:.4+.6*Math.random()});drops.length=want;
 for(const d of drops){d.y+=(o.reverse?-1:1)*d.v*dt*(1+bass);if(d.y>1.1||d.y<-.3){d.x=Math.random();d.y=o.reverse?1.05:-.1}splat(Math.floor(d.x*GW),d.y*GH,d.a*1.6)}}
function ripples(){const cx=o.centerx/100*GW,cy=o.centery/100*GH,d=o.reverse?1:-1,q=1-o.flat/100,ho=o.hole/100*.24*GW;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const r=Math.hypot(x-cx,(y-cy)/q),f=Math.sin(r*.32/(o.spread/100)+d*T*2.2);if(r>ho)set(x,y,Math.pow(Math.max(0,f),3)*1.6*Math.exp(-r/GW*2.2)*(1+bass*2))}}
const EN=4096,tE=new Uint8Array(EN+1);let tbr=-1,txW=0,txH=0,dts=.033;
// Follows KDE's light/dark mode: mode.js sits beside this page and is rewritten when the mode changes
let modeT=0,modeM=-1;window.__mode=l=>{modeT=l?1:0;if(modeM<0)modeM=modeT};
function pollMode(){if(!o.automode||paused)return;const e=document.createElement("script");e.src="mode.js?"+Date.now();e.onload=e.onerror=()=>e.remove();document.body.appendChild(e)}
setTimeout(pollMode,0);setInterval(pollMode,3000);
const LBG=[.93,.93,.93],LHOT=[.75,.2,.02],mx3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
let last=0,paused=false;
function draw(now){requestAnimationFrame(draw);if(paused)return;let dt=Math.max(0,Math.min(.1,(now-last)/1000||0));last=now;dts+=(Math.min(dt,.06)-dts)*.15;dt=dts;
 const a=o.audioamt/100;if(!o.audio)bass=level=0;lvS+=(level-lvS)*Math.min(1,dt*1.5);const sd=dt*o.speed/100*(1+lvS*a*.5);T+=sd;
 // frame-rate independent afterglow
 const keep=Math.pow(o.trail/100,dt*9);for(let i=0;i<E.length;i++)E[i]*=keep;
 const inj=1-keep,saved=bass;bass*=a;
 if(o.pattern==="blackhole"){const g=Math.max(.08,inj)*.95;const A=E;E=tmp();blackhole(sd);for(let i=0;i<E.length;i++)A[i]+=E[i]*g;E=A;holeGlow()}
 else if(o.pattern==="swirl"){const g=Math.max(.08,inj)*1.15;const A=E;E=tmp();swirl(sd);for(let i=0;i<E.length;i++)A[i]+=E[i]*g;E=A}
 else if(o.pattern==="rain"){const g=Math.max(.15,inj)*1.6;const A=E;E=tmp();rain(sd);for(let i=0;i<E.length;i++)A[i]+=E[i]*g;E=A}
 else if(o.pattern==="waves")waves();else ripples();
 bass=saved;const br=o.brightness/100*1.9;if(br!==tbr){tbr=br;for(let i=0;i<=EN;i++)tE[i]=255*(1-Math.exp(-i/EN*7))}const qs=br*EN/7;
 for(let y=0,i=0;y<GH;y++)for(let x=0;x<GW;x++,i++){const q=E[i]*fadeCol[x]*qs;B[i]=q>=EN?255:tE[q|0]}
 gl.viewport(0,0,W,H);if(txW!==GW||txH!==GH){gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,GW,GH,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,B);txW=GW;txH=GH}else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,GW,GH,gl.LUMINANCE,gl.UNSIGNED_BYTE,B);
 gl.uniform1i(U.t,0);gl.uniform2f(U.g,GW,GH);gl.uniform2f(U.res,W,H);gl.uniform1f(U.pitch,pitch);{const g=o.automode?modeT:0;if(modeM<0)modeM=g;modeM+=(g-modeM)*Math.min(1,dt*2.2)}const lm=modeM<.004?0:modeM>.996?1:modeM;gl.uniform1f(U.size,Math.min(1,o.dotsize/100*(1+.24*lm)));gl.uniform1f(U.unlit,Math.min(1,o.unlit/100+.1*lm));gl.uniform1f(U.sq,o.shape==="square"?1:0);
 gl.uniform3fv(U.col,o.schemecolor);gl.uniform3fv(U.hot,mx3(o.hotcolor,LHOT,lm));gl.uniform3fv(U.bg,mx3(o.bgcolor,LBG,lm));gl.drawArrays(gl.TRIANGLES,0,3)}
let tb=null;function tmp(){if(!tb||tb.length!==GW*GH)tb=new Float32Array(GW*GH);else tb.fill(0);return tb}
const val=(k,v)=>{if(Array.isArray(o[k])){const a=(Array.isArray(v)?v:String(v).trim().split(/[\s,]+/)).map(Number);return a.length>=3&&a.slice(0,3).every(isFinite)?a.slice(0,3):o[k]}
 if(typeof o[k]==="number"){v=Number(v);return isFinite(v)?v:o[k]}if(typeof o[k]==="boolean")return v===true||v==="true"||v===1||v==="1";return String(v)};
window.wallpaperPropertyListener={applyUserProperties(p){let re=false;for(let k in p){const v=p[k]&&typeof p[k]==="object"&&"value"in p[k]?p[k].value:p[k];if(k==="waywallen.scheme_color")k="schemecolor";if(!(k in o))continue;o[k]=val(k,v);if(k==="density"||k==="fade")re=true;if(k==="particles")pool()}
  document.body.style.background="rgb("+o.bgcolor.map(x=>Math.round(x*255))+")";if(re)layout()},setPaused(b){paused=!!b}};
if(window.wallpaperRegisterAudioListener)window.wallpaperRegisterAudioListener(a=>{let b=0,l=0;for(let i=0;i<64;i++){const m=((a[i]||0)+(a[i+64]||0))/2;l+=m;if(i<8)b+=m}{const t=Math.min(1,b/8);bass+=(t-bass)*(t>bass?.35:.12)};level+=(Math.min(1,l/24)-level)*.3});
addEventListener("mousemove",e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});document.addEventListener("mouseleave",()=>{mx=my=-9});
addEventListener("resize",layout);layout();pool();
for(const kv of location.search.slice(1).split("&")){const[k,v]=kv.split("=");if(k in o){o[k]=val(k,decodeURIComponent(v))}}layout();pool();
for(let i=0;i<60;i++){T+=.05}requestAnimationFrame(draw);
</script></body></html>
